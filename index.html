<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>5S Methodology Deep Dive</title>
    <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.1"
  }
}
</script>
<style>
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-in {
    animation: fadeIn 0.5s ease-out forwards;
  }
  @media print {
    body {
      background-color: white !important;
      color: black !important;
    }
    /* Hide everything in the root except for the presentation container */
    body > #root > div > *:not(.presentation-container) {
      display: none !important;
    }
    .presentation-container {
      display: block !important;
      padding: 0 !important;
      margin: 0 !important;
    }
    .presentation-controls {
      display: none !important;
    }
    .presentation-slide {
      page-break-after: always;
      height: 100vh; /* Attempt to fit one slide per page */
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: none !important;
      box-shadow: none !important;
      background-color: white !important;
    }
    .presentation-slide h2 {
      color: black !important;
    }
    .presentation-slide img {
      border: 1px solid #eee;
      max-height: 80vh; /* Ensure image fits on the page */
    }
  }
</style>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-900 text-slate-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
